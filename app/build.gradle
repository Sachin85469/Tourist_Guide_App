plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.arriva.touristguideapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.arriva.touristguideapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // API keys are loaded from local.properties and excluded from source control.
        Properties properties = new Properties()
        if (project.rootProject.file('local.properties').exists()) {
            properties.load(project.rootProject.file('local.properties').newDataInputStream())
        }
        def googlePlacesKey = properties.getProperty('GOOGLE_PLACES_API_KEY', '').trim()
        def geminiKey = properties.getProperty('GEMINI_API_KEY', '').trim()
        def anthropicKey = properties.getProperty('ANTHROPIC_API_KEY', '').trim()
        buildConfigField "String", "GOOGLE_PLACES_API_KEY", "\"${googlePlacesKey}\""
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
        buildConfigField "String", "ANTHROPIC_API_KEY", "\"${anthropicKey}\""
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.glide
    implementation libs.play.services.maps
    implementation libs.play.services.location
    implementation libs.places
    implementation libs.volley
    implementation libs.osmdroid
    implementation 'com.github.MKergall:osmbonuspack:6.9.0'
    implementation libs.mlkit.translate
    implementation libs.generativeai

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ML Kit on-device translation
    implementation 'com.google.mlkit:translate:17.0.3'

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.messaging
    implementation 'com.google.firebase:firebase-storage'
    implementation libs.play.services.auth

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
